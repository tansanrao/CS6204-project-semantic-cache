[project]
name = "ttl-proxy"
version = "0.1.0"
description = "FastAPI proxy service for the vLLM OpenAI-compatible backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111,<1.0",
    "httpx>=0.27,<0.28",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "qdrant-client>=1.9,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<0.30",
    "transformers>=4.44,<5.0",
    "sentence-transformers>=3.0,<4.0",
    "torch>=2.3,<3.0",
    "numpy>=1.26,<3.0",
    "uvicorn>=0.30,<0.31",
    "einops>=0.8.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.9",
    "openai>=2.6.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "ruff>=0.6,<0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "app",
    "pyproject.toml",
    "DESIGN.md",
    "AGENTS.md",
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
extend-select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
